<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>js-chart</title>
<link rel="stylesheet" href="../_shared/fonts/fonts.css">
<script src="../_shared/vendor/chartjs/chart.umd.min.js"></script>
<style>
  body { margin: 40px; font-family: 'Inter', sans-serif; color: #1d1d1f; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .box { height: 320px; }
  #status { font-size: 13px; color: #666; }
</style>
</head>
<body>
  <h1>Quarterly report</h1>
  <p id="status">Charts not drawn yet.</p>
  <div class="charts">
    <div class="box"><canvas id="bar"></canvas></div>
    <div class="box"><canvas id="line"></canvas></div>
    <div class="box"><canvas id="doughnut"></canvas></div>
    <div class="box"><svg id="svg" width="100%" height="320" viewBox="0 0 440 320"></svg></div>
  </div>
<script>
  // Drawn 500 ms after load, with animation off, so the page needs a JavaScript wait
  // and the final frame is deterministic.
  Chart.defaults.animation = false;
  Chart.defaults.font.family = 'Inter';
  Chart.defaults.maintainAspectRatio = false;
  window.addEventListener('load', () => setTimeout(() => {
    const q = ['Q1', 'Q2', 'Q3', 'Q4'];
    new Chart(bar, { type: 'bar', data: { labels: q, datasets: [
      { label: '2025', data: [120, 150, 170, 210], backgroundColor: '#94a3b8' },
      { label: '2026', data: [140, 180, 205, 260], backgroundColor: '#2563eb' }] } });
    new Chart(line, { type: 'line', data: { labels: q, datasets: [
      { label: 'Margin %', data: [18.2, 19.5, 21.1, 22.8], borderColor: '#16a34a', tension: .3 }] } });
    new Chart(doughnut, { type: 'doughnut', data: { labels: ['EU', 'US', 'APAC', 'Other'], datasets: [
      { data: [42, 31, 19, 8], backgroundColor: ['#2563eb', '#16a34a', '#f59e0b', '#ef4444'] }] } });
    const svg = document.getElementById('svg'), vals = [35, 80, 55, 120, 95, 140, 110];
    vals.forEach((v, i) => {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', 20 + i * 60); r.setAttribute('y', 300 - v * 2); r.setAttribute('width', 40);
      r.setAttribute('height', v * 2); r.setAttribute('fill', i % 2 ? '#7c3aed' : '#0ea5e9'); svg.appendChild(r);
    });
    document.getElementById('status').textContent = 'Charts drawn by JavaScript: 4 of 4.';
  }, 500));
</script>
</body>
</html>
